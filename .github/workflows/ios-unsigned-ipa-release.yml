name: iOS Unsigned IPA Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.0-ios-unsigned)"
        required: true
        type: string
      release_name:
        description: Release title (optional)
        required: false
        type: string
      prerelease:
        description: Mark release as prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          safe_tag="$(echo "${{ github.event.inputs.tag }}" | tr '/ ' '--')"
          ipa_path="build/ios/ipa/nordacess-ios-unsigned-${safe_tag}.ipa"
          release_name="${{ github.event.inputs.release_name }}"

          if [ -z "$release_name" ]; then
            release_name="iOS Unsigned IPA ${safe_tag}"
          fi

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        shell: bash
        run: |
          app_path="build/ios/iphoneos/Runner.app"
          payload_dir="build/ios/ipa/Payload"
          ipa_path="${{ steps.meta.outputs.ipa_path }}"

          if [ ! -d "$app_path" ]; then
            echo "Runner.app not found at $app_path"
            exit 1
          fi

          rm -rf "build/ios/ipa"
          mkdir -p "$payload_dir"
          cp -R "$app_path" "$payload_dir/Runner.app"

          (
            cd "build/ios/ipa"
            /usr/bin/zip -r -y "../../../$ipa_path" Payload
          )

          if [ ! -f "$ipa_path" ]; then
            echo "Failed to create IPA at $ipa_path"
            exit 1
          fi

      - name: Generate checksum
        shell: bash
        run: |
          shasum -a 256 "${{ steps.meta.outputs.ipa_path }}" > "${{ steps.meta.outputs.ipa_path }}.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.ipa_path }}
            ${{ steps.meta.outputs.ipa_path }}.sha256
